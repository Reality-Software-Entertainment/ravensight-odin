name: CI

# Nightly on weekdays and on demand, never on a push or a pull request
# (owner decision, November 19, 2026). Changes are checked locally first by
# the pre-push hook in .githooks; this run is the safety net behind it, and
# a night when main has not moved since the last green run costs one short job.
on:
  schedule:
    - cron: '25 7 * * 1-5'
  workflow_dispatch:

jobs:
  quiet:
    # A scheduled run on a main that already passed is skipped; a dispatch always runs.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          wf=$(basename "${GITHUB_WORKFLOW_REF%%@*}")
          last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?event=schedule&status=success&branch=main&per_page=1" --jq '.workflow_runs[0].head_sha // ""')
          if [ "$last" = "$GITHUB_SHA" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "main is unchanged since the last green nightly ($last)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: quiet
    if: needs.quiet.outputs.run == 'true'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Odin
        uses: laytan/setup-odin@v2
        with:
          release: dev-2026-08
          token: ${{ github.token }}

      - name: Install libcurl (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev zlib1g-dev

      - name: Unit tests
        run: odin test ravensight

      - name: Build example
        run: odin build examples/minimal -out:minimal.bin

      - name: Build error capture sample
        run: odin build examples/error_capture -out:error_capture.bin
